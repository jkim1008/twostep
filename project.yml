name: TwoStep
options:
  bundleIdPrefix: com.kadiamtech
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  TwoStepCore:
    path: TwoStepCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3DRBN7MB8U
targets:
  TwoStep:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TwoStepCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Two Step
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadiamtech.twostep
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 3DRBN7MB8U
  TwoStepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        DEVELOPMENT_TEAM: 3DRBN7MB8U
    dependencies:
      - target: TwoStep
schemes:
  TwoStep:
    build:
      targets:
        TwoStep: all
        TwoStepUITests: [test]
    test:
      targets: [TwoStepUITests]
